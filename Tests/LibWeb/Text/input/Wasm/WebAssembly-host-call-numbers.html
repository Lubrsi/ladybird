        let echo = value => value;
        const seen = [];
        const imports = {
            env: {
                echo_i32: value => echo(value),
                echo_f32: value => echo(value),
                echo_f64: value => echo(value),
                observe(a, b, c, d, e) {
                    seen.push({ count: arguments.length, values: [a, b, c, d, e] });
                },
                eight(...values) {
                    seen.push(values);
                    return 42.5;
                },
            },
        };

        const module = new WebAssembly.Module(bytes);
        const exports = new WebAssembly.Instance(module, imports).exports;
        internals.waitForWebAssemblyCompilation(module);

        const describe = value => (Object.is(value, -0) ? "-0" : String(value));

        println("i32:");
        for (const value of [-1, 2147483647, -2147483648])
            println(`  ${describe(exports.call_echo_i32(value))}`);

        println("f32:");
        for (const value of [-0, NaN, 0.1, 1.5])
            println(`  ${describe(exports.call_echo_f32(value))}`);

        println("f64:");
        for (const value of [-0, NaN, 1e300, Infinity])
            println(`  ${describe(exports.call_echo_f64(value))}`);

        println("i32 result conversion:");
        const value_of = {
            valueOf() {
                println("  valueOf called");
                return 5;
            },
        };
        for (const result of [4294967297, "7", undefined, 2.9, value_of]) {
            echo = () => result;
            println(`  ${describe(exports.call_echo_i32(0))}`);
        }

        exports.call_observe(3, 0.5, -0);
        const observed = seen.pop();
        println(`observe: count ${observed.count}, values ${observed.values.map(describe).join(", ")}`);

        println(`eight returned ${exports.call_eight()}`);
        println(`eight received ${seen.pop().map(describe).join(", ")}`);

        const error = new Error("thrown from import");
        echo = () => {
            throw error;
        };
        try {
            exports.call_echo_i32(1);
            println("no exception");
        } catch (e) {
            println(`thrown value is identical: ${e === error}`);
        }

        const conversion_error = new Error("thrown from valueOf");
        echo = () => ({
            valueOf() {
                throw conversion_error;
            },
        });
        try {
            exports.call_echo_f64(1);
            println("no exception");
        } catch (e) {
            println(`conversion exception is identical: ${e === conversion_error}`);
        }

        echo = value => exports.add_one(value);
        println(`re-entry: ${exports.call_echo_i32(41)}`);

        echo = value => value;
        println(`after exceptions: ${exports.call_echo_i32(9)}`);
