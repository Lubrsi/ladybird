<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    // Aborting a fetch cancels its request's body. A redirect that drops or re-extracts the body leaves the Request
    // object's body untouched.
    promiseTest(async () => {
        const server = httpTestServer();
        const token = crypto.randomUUID();
        const corsHeaders = { "Access-Control-Allow-Origin": "*" };
        const nextTask = () => new Promise(resolve => setTimeout(resolve, 0));

        const createHeldEcho = (method, name) =>
            server.createEcho(method, `/fetch-abort-after-redirect-${name}-${token}`, {
                status: 200,
                headers: corsHeaders,
                wait_for_unblock: token,
            });
        const createRedirect = (status, name, location) =>
            server.createEcho("POST", `/fetch-abort-after-redirect-${name}-${token}`, {
                status,
                headers: { ...corsHeaders, "Location": location },
            });
        const requestArrived = url => {
            const recordedURL = `${server.baseURL}/recorded-request-headers${new URL(url).pathname}`;
            return fetch(recordedURL, { cache: "no-store" }).then(
                response => response.ok,
                () => false
            );
        };

        const abortWhileHeld = async (url, heldURL) => {
            const request = new Request(url, { method: "POST", body: "body" });
            const controller = new AbortController();
            const fetched = fetch(request, { signal: controller.signal }).then(
                () => "resolved",
                error => error.name
            );
            while (!(await requestArrived(heldURL)))
                await nextTask();
            controller.abort();
            return `${await fetched}, body used: ${request.bodyUsed}`;
        };

        const heldPostURL = await createHeldEcho("POST", "held-post");
        println(`no redirect: ${await abortWhileHeld(heldPostURL, heldPostURL)}`);

        const heldGetURL = await createHeldEcho("GET", "held-get");
        const seeOtherURL = await createRedirect(303, "see-other", heldGetURL);
        println(`303 to a GET: ${await abortWhileHeld(seeOtherURL, heldGetURL)}`);

        const heldRedirectedPostURL = await createHeldEcho("POST", "held-redirected-post");
        const temporaryRedirectURL = await createRedirect(307, "temporary-redirect", heldRedirectedPostURL);
        println(`307 to a POST: ${await abortWhileHeld(temporaryRedirectURL, heldRedirectedPostURL)}`);

        await fetch(`${server.baseURL}/unblock/${token}`);
    });
</script>
