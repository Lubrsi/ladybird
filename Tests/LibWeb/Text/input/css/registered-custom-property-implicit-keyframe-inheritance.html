<!DOCTYPE html>
<style>
@property --b {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: true;
}
@keyframes spin {
    to { --b: 90deg; }
}
#parent {
    --b: 30deg;
}
#child {
    animation: spin 1s linear -0.5s paused;
    transform: rotate(var(--b));
}
</style>
<div id="parent">
    <div id="child"></div>
</div>
<script src="../include.js"></script>
<script>
test(() => {
    const child = document.getElementById("child");
    println(`#child --b (50% of 30deg → 90deg = 60deg): ${getComputedStyle(child).getPropertyValue("--b")}`);
    println(`#child transform: ${getComputedStyle(child).getPropertyValue("transform")}`);
});
</script>
