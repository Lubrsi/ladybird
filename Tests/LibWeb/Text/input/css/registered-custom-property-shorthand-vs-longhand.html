<!DOCTYPE html>
<style>
@property --a {
    syntax: "<color>";
    initial-value: rgb(255, 0, 0);
    inherits: false;
}
@keyframes recolor {
    from { --a: rgb(255, 0, 0); }
    to { --a: rgb(0, 0, 255); }
}
#box {
    animation: recolor 1s linear -0.5s paused;
    background: linear-gradient(var(--a), red, blue);
    background-color: rgb(0, 128, 0);
    width: 50px;
    height: 50px;
}
</style>
<div id="box"></div>
<script src="../include.js"></script>
<script>
test(() => {
    const box = document.getElementById("box");
    println(`#box --a: ${getComputedStyle(box).getPropertyValue("--a")}`);
    println(`#box background-image: ${getComputedStyle(box).getPropertyValue("background-image")}`);
    println(`#box background-color: ${getComputedStyle(box).getPropertyValue("background-color")}`);
});
</script>
