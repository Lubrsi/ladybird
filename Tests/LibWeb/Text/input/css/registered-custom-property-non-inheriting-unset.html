<!DOCTYPE html>
<style>
@property --c {
    syntax: "*";
    initial-value: initial-token;
    inherits: false;
}
@property --c-angle {
    syntax: "<angle>";
    initial-value: 5deg;
    inherits: false;
}
#parent {
    --c: parent-token;
    --c-angle: 80deg;
}
#child {
    --c: unset;
    --c-angle: unset;
}
</style>
<div id="parent">
    <div id="child"></div>
</div>
<script src="../include.js"></script>
<script>
test(() => {
    const child = document.getElementById("child");
    println(`#child --c (universal, unset → registered initial): ${getComputedStyle(child).getPropertyValue("--c")}`);
    println(`#child --c-angle (typed, unset → registered initial): ${getComputedStyle(child).getPropertyValue("--c-angle")}`);
});
</script>
