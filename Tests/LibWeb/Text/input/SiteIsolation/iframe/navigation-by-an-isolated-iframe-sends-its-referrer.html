<!DOCTYPE html>
<script src="../../include.js"></script>
<script>
    // An isolated iframe navigates a sibling that another process hosts. The navigation's referrer is the source
    // iframe's URL, under its referrer policy, and never the URL of the document the sibling is showing.
    promiseTest(async () => {
        const httpServer = httpTestServer();
        const runId = crypto.randomUUID();
        const targetHostname = uniqueLocalhostHostname("oop-referrer-target");

        const echo = async (path, body, hostname) => {
            const url = new URL(
                await httpServer.createEcho("GET", path, {
                    status: 200,
                    headers: { "Content-Type": "text/html" },
                    body,
                })
            );
            url.hostname = hostname;
            return url;
        };

        const targetFirstUrl = await echo(`/oop-referrer-target-first-${runId}`, "<!DOCTYPE html>first", targetHostname);
        const targetSecondUrl = await echo(`/oop-referrer-target-second-${runId}`, "<!DOCTYPE html>second", targetHostname);
        const sourceUrl = await echo(
            `/oop-referrer-source-${runId}`,
            `<!DOCTYPE html><meta name="referrer" content="unsafe-url">
            <a id="link" target="target" href="${targetSecondUrl.href}">sibling</a>
            <script>document.getElementById("link").click();<\/script>`,
            uniqueLocalhostHostname("oop-referrer-source")
        );

        const target = document.createElement("iframe");
        target.name = "target";
        target.src = targetFirstUrl;
        document.body.appendChild(target);
        await new Promise(resolve => (target.onload = resolve));

        const source = document.createElement("iframe");
        source.src = sourceUrl;
        document.body.appendChild(source);

        const recordedUrl = `${httpServer.baseURL}/recorded-request-headers/echo/oop-referrer-target-second-${runId}`;
        let headers = null;
        for (let attempt = 0; attempt < 600 && headers === null; ++attempt) {
            try {
                const response = await fetch(recordedUrl);
                if (response.ok) headers = await response.json();
            } catch {}
            if (headers === null) await timeout(25);
        }
        const referrer = headers?.["Referer"]?.[0];
        println(`Referer is the source iframe's URL: ${referrer === sourceUrl.href}`);
        println(`Referer is the sibling's previous URL: ${referrer === targetFirstUrl.href}`);
        println(internals.dumpSiteIsolationProcessTree().trimEnd());
    });
</script>
